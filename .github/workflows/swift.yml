name: Swift

on:
  pull_request:
    branches: [main, develop]

jobs:
  swift_package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Native Swift Toolchain Tests
        run: set -o pipefail && swift test -v --parallel | xcbeautify

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v --parallel

  apple_platforms_matrix:
    runs-on: macos-latest
    strategy:
      matrix:
        destination:
          [
            "platform=macOS",
            "platform=iOS Simulator,name=iPhone 17 Pro",
            "platform=tvOS Simulator,name=Apple TV",
            "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm)",
          ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Test Platform Matrix (Xcode SDKs)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Adhan \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
