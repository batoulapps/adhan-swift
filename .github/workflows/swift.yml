name: Swift

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build_osx:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
      - name: Build swift package
        run: swift build -v
      - name: Run tests
        run: swift test -v
      - name: Fastlane
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "2"
        run: fastlane tests

  build_ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
